- clean: ['~']

- create:
    ~/misc:
      mode: 755
    ~/projects:
      mode: 755
    ~/screensavers:
      mode: 755

- link:
    ~/.config/nvim:
      create: true
      path: nvim
    ~/.gitconfig:
      force: true
      path: gitconfig
    ~/.gitignore_global: gitignore_global
    ~/.npmrc: npmrc
    ~/.config/ghostty/config:
      create: true
      path: ghostty_config
    ~/.oh-my-zsh/custom/themes/simple.zsh-theme: oh-my-zsh/custom/themes/simple.zsh-theme
    ~/.vim: vim
    ~/.vimrc: vimrc
    ~/.zshrc:
        force: true
        path: zshrc
    ~/.zprofile: zprofile
    ~/screensavers/gourcery.sh: screensavers/gourcery.sh

- shell:
    -
      command: 'source $HOME/.zshrc && omz theme set simple'
      description: 'Configuring omz theme...'
      stdout: true
      stderr: true
    -
      command: 'source $HOME/.zshrc && omz plugin enable git terraform'
      description: 'Enabling omz plugins...'
      stdout: true
      stderr: true
    -
      command: 'brew install awscli neovim pre-commit pyenv-virtualenvwrapper tenv tfsec direnv'
      description: 'Installing additional tools...'
      stdout: true
      stderr: true
